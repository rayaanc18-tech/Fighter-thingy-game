<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Brawl Arena</title>
<style>
:root{--bg:#10131f;--card:#1d2338;--card2:#2a3354;--tx:#f2f4ff;--ac:#ffcc33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131f;--card:#1d2338;--card2:#2a3354;--tx:#f2f4ff}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS",Verdana,sans-serif}
#wrap{position:relative;max-width:960px;margin:0 auto;aspect-ratio:16/9;background:#000;overflow:hidden}
canvas{width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle at 50% 20%,#2b3a7a,#10131f 70%);overflow:auto;padding:10px;text-align:center}
#ui.off{display:none}
h1{font-size:clamp(28px,7vw,64px);margin:0;color:var(--ac);text-shadow:3px 3px #c22;letter-spacing:2px}
h2{margin:0;font-size:clamp(18px,3.5vw,30px)}
p.s{margin:0;opacity:.75;font-size:clamp(11px,1.6vw,14px)}
.btn{background:var(--card2);color:var(--tx);border:2px solid var(--ac);border-radius:10px;padding:10px 26px;font:bold clamp(14px,2.6vw,22px) inherit;font-family:inherit;cursor:pointer;min-width:200px}
.btn:hover{background:var(--ac);color:#111}.btn.sm{min-width:0;padding:6px 16px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:92%}
.card{background:var(--card);border:2px solid var(--card2);border-radius:10px;padding:6px;cursor:pointer;font-size:clamp(9px,1.5vw,12px)}
.card:hover{border-color:var(--ac);transform:translateY(-2px)}.card b{font-size:clamp(12px,2vw,17px);display:block}
.ic{font-size:clamp(22px,5vw,40px)}.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.skin{width:clamp(60px,12vw,100px);padding:8px;border-radius:12px;border:3px solid var(--card2);background:var(--card);cursor:pointer}
.skin:hover{border-color:var(--ac)}.dot{width:100%;aspect-ratio:1;border-radius:50%;margin-bottom:4px}
.fav{color:var(--ac)}h1{background:linear-gradient(#fff,#ffcc33 55%,#ff6a00);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(3px 4px 0 #a11)}#ui{background:radial-gradient(circle at 50% 15%,#3b4fb0,#151a38 55%,#07080f)}.btn{background:linear-gradient(#3a4680,#222a50);box-shadow:0 4px 0 #0008,0 0 14px #ffcc3333;transition:.15s}.btn:hover{transform:scale(1.05);box-shadow:0 0 22px #ffcc33}.card{background:linear-gradient(#262e4e,#171c32)}.card:hover{box-shadow:0 0 16px #ffcc3388}
</style></head><body>

const UN=new Set();try{JSON.parse(localStorage.getItem('brawlUN')||'[]').forEach(x=>UN.add(x))}catch(e){}

// ---------- MENUS ----------
function show(h){ui.className='';ui.innerHTML=h}
function mainMenu(){running=false;show(`<h1>BRAWL ARENA</h1><p class="s">3-minute matches • fewest deaths wins • Unlocked ${UN.size}/4 (auto-saved)<br>P1: WASD + F/G/H • P2: Arrows + , . / • Solo: WASD + J/K/L</p>
<button class="btn" onclick="S.mode='training';pickP()">Training</button>
<button class="btn" onclick="S.mode='battle';pickP()">Battle</button>
<button class="btn" onclick="S.mode='local';pickP()">Local 2 Player</button>

<button class="btn" onclick="S.mode='adv1';pickP()">Adventure • 1 Player</button>

<button class="btn" onclick="custom()">Customise</button>`)}
function cards(fn,favs){return `<div class="grid">`+C.map((c,i)=>`<div class="card" style="${LK(i)?'opacity:.45;filter:grayscale(1)':''}" onclick="${LK(i)?'':fn+'('+i+')'}"><div class="ic">${LK(i)?'🔒':c.e}</div><b>${c.n}${favs&&S.fav&&S.fav.c===i?' <span class=fav>★</span>':''}</b>${LK(i)?'<i>Beat '+BOSSES[i-11].n+'</i><br>':''}J punch<br>K ${c.sp.n}<br>L ${c.ab.n}<br>Spd ${'●'.repeat(Math.round(c.spd))} Wt ${'●'.repeat(Math.round(c.wt*3))}</div>`).join('')+`</div>`}
function skins(c,fn){return `<div class="row">`+[0,1,2,3].map(s=>`<div class="skin" onclick="${fn}(${s})"><div class="dot" style="background:${col(c,s)}"></div>Skin ${s+1}</div>`).join('')+`</div>`}

function pickC(){show(`<h2>${is2()?'Player 2: choose your fighter':'Choose CPU opponent'}</h2>${cards('chosenC')}<button class="btn sm" onclick="pickP()">← Back</button>`)}

const is2=()=>S.mode==='local'||isB()||S.mode==='adv2'||S.mode==='adv3';
function chosenC(i){S.c=i;if(is2()){show(`<h2>Player 2 — ${C[i].n}: pick a skin</h2>${skins(i,'skinC')}<button class="btn sm" onclick="pickC()">← Back</button>`);return}S.cs=(i===S.p&&S.ps===1)?2:1;if(i===S.p&&S.ps===S.cs)S.cs=(S.ps+1)%4;pickM()}
function skinC(s){S.cs=s;if(S.c===S.p&&S.cs===S.ps)S.cs=(S.ps+1)%4;S.mode==='boss3'||S.mode==='adv3'?pickP3():isB()?pickB():isAdv()?startAdv():pickM()}

function pickB(){show(`<h2>Choose your boss</h2><div class="grid">`+BOSSES.map((b,i)=>`<div class="card" onclick="S.boss=${i};pickM()"><div class="ic">${b.e}</div><b>${b.n}</b>HP ${b.hp}<br>${i?(UN.has(11+i)?'✅ ':'🎁 ')+'Unlocks '+C[11+i].n:'No unlock'}</div>`).join('')+`</div><button class="btn sm" onclick="pickC()">← Back</button>`)}
function unlock(){const k=S.boss||0;if(k>0&&!UN.has(11+k)){UN.add(11+k);G.new=C[11+k].n;persist();}}
function pickM(){show(`<h2>Select stage</h2><div class="row">`+MAPS.map((m,i)=>`<div class="card" style="width:28%" onclick="S.map=${i};start()"><div style="height:80px;border-radius:6px;box-shadow:inset 0 0 20px #0008;background:linear-gradient(transparent 62%,${['#4f8a5a','#c98b4a','#1a1038','#3a1208','#12002b','#cfe3f5'][i]} 62%),radial-gradient(circle at 75% 28%,#fff9 0 9%,transparent 10%),linear-gradient(${m.bg[0]},${m.bg[1]})"></div><b>${m.n}</b></div>`).join('')+`</div><button class="btn sm" onclick="pickC()">← Back</button>`)}

// ---------- GAME ----------
function mk(ci,s,x,ai){return{w:30,h:46,sc:1,team:0,c:C[ci],ci,s,x,y:60,vx:0,vy:0,face:1,dmg:0,stocks:99,deaths:0,jumps:2,jp:false,stun:0,inv:90,hit:0,cd:{a:0,s:0,b:0},atk:0,dash:0,boost:0,slow:0,drop:0,ai,g:false,col:col(ci,s)}}
const BOSS={n:'Titan',e:'👹',h:350,spd:2,jmp:0,wt:5,atk:16,sp:{n:'Magma Orb',dmg:10,kb:8,v:7,col:'#f40',life:120,sh:[[1,0],[1,-.2]],cd:80,r:16},ab:{n:'Stomp',t:'burst',cd:260}};

{n:'Mecha-X',e:'🤖',ci:101,h:200,col:'#5a6a80',hp:400,sc:2.1,bw:70,bh:97,spd:2.4,jmp:0,wt:4.5,atk:13,w:'gun',sp:{n:'Laser Volley',dmg:6,kb:5,v:16,col:'#4ff',life:60,sh:[[1,0],[1,.04],[1,-.04],[1,.08],[1,-.08]],cd:55,r:6},ab:{n:'Overload',t:'burst',cd:220}},

function mkEn(t,x,y){const E=EN[t];return Object.assign(mk(0,0,x,true),{c:E,ci:200,en:1,hp:E.hp,col:E.col,team:1,stocks:99,y,w:E.bw||30,h:E.bh||46,sc:E.sc||1,inv:0,face:-1})}
function aiEn(f,o){const i={},dx=o.x-f.x,dy=o.y-f.y,r=Math.random,sh=f.c.sp.cd<9000;f.pd=f.pd||(r()<.5?-1:1);
const near=Math.abs(dx)<(sh?420:360)&&Math.abs(dy)<130;let d=near?(Math.sign(dx)||1):f.pd;if(near&&sh&&Math.abs(dx)<200)d=0;
if(d&&!G.m.pl.some(p=>f.x+d*24>p.x&&f.x+d*24<p.x+p.w&&Math.abs(p.y-f.y)<10)){if(!near)f.pd*=-1;d=0}
i.l=d<0;i.r=d>0;if(near)f.face=Math.sign(dx)||f.face;
if(Math.abs(dx)<f.w+22&&Math.abs(dy)<45&&r()<.06)i.a=true;if(sh&&near&&r()<.015)i.s=true;return i}
function lvlData(n){let s=n*7919;const R=()=>(s=(s*16807)%2147483647)/2147483647,boss=n===5||n===10,W=boss?1500:2400+n*320,pl=[],en=[];
if(boss){pl.push({x:0,y:420,w:W,s:1},{x:250,y:320,w:140},{x:640,y:320,w:140},{x:1030,y:320,w:140},{x:450,y:230,w:150},{x:850,y:230,w:150});en.push({t:'grunt',x:500,y:420},{t:'spiky',x:750,y:420});if(n===10)en.push({t:'brute',x:620,y:420})}
else{let x=0;while(x<W){const w=300+Math.floor(R()*300);pl.push({x,y:420,w,s:1});x+=w;if(x<W-500)x+=70+Math.floor(R()*30+n*8)}
for(let k=0;k<4+n;k++)pl.push({x:200+R()*(W-500),y:290+R()*60,w:110+R()*50});
for(const p of pl.slice()){if(p.s&&p.x>450){const c=1+(R()<.4+n*.04?1:0);for(let k=0;k<c;k++){const q=R();en.push({t:n>=6&&q<.2?'brute':n>=4&&q<.4?'bot':n>=3&&q<.6?'spiky':'grunt',x:p.x+50+R()*(p.w-100),y:420})}}}}
return{W,pl,en,boss,bx:1150}}
